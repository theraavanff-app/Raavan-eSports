
<section class="auth-page">
    <div class="auth-card">
        <div class="auth-logo">R</div>

        <h1>RAAVAN <span>ESPORTS</span></h1>
        <p class="auth-subtitle">YOUR BATTLE. YOUR GLORY.</p>

        <h2>Create Account</h2>
        <p class="auth-description">Join the battlefield today!</p>

        <form id="registerForm">
            <label for="registerName">Player Name</label>
            <input type="text" id="registerName"
                placeholder="Enter player name" required>

            <label for="registerEmail">Email Address</label>
            <input type="email" id="registerEmail"
                placeholder="Enter email" required>

            <label for="registerPassword">Password</label>
            <input type="password" id="registerPassword"
                placeholder="Create password" minlength="6" required>

            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword"
                placeholder="Confirm password" minlength="6" required>

            <button type="submit" id="registerBtn">CREATE ACCOUNT</button>
            <p id="registerError" class="auth-error"></p>
        </form>

        <p class="auth-switch">
            Already registered?
            <a href="pages/login.html">Login Now</a>
        </p>
    </div>
</section>
