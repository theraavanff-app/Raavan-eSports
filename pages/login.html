
<section class="auth-page">
    <div class="auth-card">
        <div class="auth-logo">R</div>

        <h1>RAAVAN <span>ESPORTS</span></h1>
        <p class="auth-subtitle">YOUR BATTLE. YOUR GLORY.</p>

        <h2>Welcome Back!</h2>
        <p class="auth-description">Login to enter the battlefield.</p>

        <form id="loginForm">
            <label for="loginEmail">Email Address</label>
            <input
                type="email"
                id="loginEmail"
                placeholder="Enter your email"
                required
            >

            <label for="loginPassword">Password</label>
            <input
                type="password"
                id="loginPassword"
                placeholder="Enter password"
                required
            >

            <button type="submit" id="loginBtn">LOGIN</button>
            <p id="loginError" class="auth-error"></p>
        </form>

        <p class="auth-switch">
            Don't have an account?
            <a href="pages/register.html">Register Now</a>
        </p>
    </div>
</section>
