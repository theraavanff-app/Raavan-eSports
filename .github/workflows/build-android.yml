
name: Build RAAVAN ESPORTS APK

on:
  push:
    branches:
      - admob-android-wrapper
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Create Android project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/raavan/esports/admob

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          EOF
          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "RaavanAdMobApp"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
          }
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
          }

          android {
              namespace = "com.raavan.esports.admob"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.raavan.esports.admob"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
          }

          dependencies {
              implementation("com.google.android.gms:play-services-ads:25.5.0")
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>

              <application
                  android:allowBackup="true"
                  android:label="RAAVAN ESPORTS"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:hardwareAccelerated="true">

                  <meta-data
                      android:name="com.google.android.gms.ads.APPLICATION_ID"
                      android:value="ca-app-pub-4249303837052016~3743934650"/>

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/raavan/esports/admob/MainActivity.java <<'EOF'
          package com.raavan.esports.admob;

          import android.app.Activity;
          import android.os.Bundle;
          import android.view.ViewGroup;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.CookieManager;
          import android.content.Intent;
          import android.net.Uri;
          import android.widget.LinearLayout;
          import android.widget.FrameLayout;
          import com.google.android.gms.ads.MobileAds;
          import com.google.android.gms.ads.AdRequest;
          import com.google.android.gms.ads.AdSize;
          import com.google.android.gms.ads.AdView;

          public class MainActivity extends Activity {

              private WebView webView;
              private AdView adView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  LinearLayout layout = new LinearLayout(this);
                  layout.setOrientation(LinearLayout.VERTICAL);
                  layout.setFitsSystemWindows(true);

                  webView = new WebView(this);
                  webView.getSettings().setJavaScriptEnabled(true);
                  webView.getSettings().setDomStorageEnabled(true);
                  webView.getSettings().setDatabaseEnabled(true);

                  CookieManager.getInstance().setAcceptCookie(true);
                  CookieManager.getInstance()
                      .setAcceptThirdPartyCookies(webView, true);

                  webView.setWebChromeClient(new WebChromeClient());

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(
                          WebView view, WebResourceRequest request) {

                          Uri uri = request.getUrl();
                          String host = uri.getHost();

                          if ("https".equals(uri.getScheme())
                              && "theraavanff-app.github.io".equals(host)) {
                              return false;
                          }

                          try {
                              startActivity(new Intent(Intent.ACTION_VIEW, uri));
                          } catch (Exception e) {
                              e.printStackTrace();
                          }
                          return true;
                      }
                  });

                  webView.setDownloadListener((url, userAgent,
                      contentDisposition, mimeType, contentLength) -> {
                      try {
                          startActivity(new Intent(
                              Intent.ACTION_VIEW, Uri.parse(url)));
                      } catch (Exception e) {
                          e.printStackTrace();
                      }
                  });

                  layout.addView(webView,
                      new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, 0, 1f));

                  FrameLayout adContainer = new FrameLayout(this);
                  int gap = (int) (10 * getResources().getDisplayMetrics().density + 0.5f);
                  adContainer.setPadding(0, gap, 0, 0);
                  layout.addView(adContainer,
                      new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT));

                  setContentView(layout);

                  webView.loadUrl(
                      "https://theraavanff-app.github.io/Raavan-eSports/");

                  MobileAds.initialize(this, status -> {
                      runOnUiThread(() -> {
                          adView = new AdView(this);
                          adView.setAdSize(AdSize.BANNER);
                          adView.setAdUnitId(
                              "ca-app-pub-3940256099942544/9214589741");

                          adContainer.addView(adView);
                          adView.loadAd(new AdRequest.Builder().build());
                      });
                  });
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onDestroy() {
                  if (adView != null) {
                      adView.destroy();
                  }
                  if (webView != null) {
                      webView.destroy();
                  }
                  super.onDestroy();
              }
          }
          EOF

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RAAVAN-ESPORTS-APK
          path: app/build/outputs/apk/debug/app-debug.apk
